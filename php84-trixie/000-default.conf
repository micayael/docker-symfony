<VirtualHost *:${APACHE_HTTP_PORT}>
    ServerName domain.tld
    ServerAlias www.domain.tld

    # Apache descarta el header Authorization antes de que llegue a PHP. Sin
    # esto, los tokens Bearer nunca llegan al authenticator y todo request a una
    # API autenticada da 401.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride None
        Require all granted
        Allow from All

        FallbackResource /index.php
    </Directory>

    # uncomment the following lines if you install assets as symlinks
    # or run into problems when compiling LESS/Sass/CoffeeScript assets
    <Directory ${PROJECT_ROOT}>
        Options FollowSymlinks
    </Directory>

    # optionally disable the fallback resource for the asset directories
    # which will allow Apache to return a 404 error when files are
    # not found instead of passing the request to Symfony
    <Directory ${APACHE_DOCUMENT_ROOT}/bundles>
        FallbackResource disabled
    </Directory>
    # error.log y access.log son symlinks a stderr/stdout en la imagen oficial,
    # así los logs salen por "docker logs" en lugar de crecer dentro del contenedor
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
