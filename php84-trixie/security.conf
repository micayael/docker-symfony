# Hide Apache version and modules in headers and error pages
ServerTokens Prod
ServerSignature Off

# Disable TRACE method
TraceEnable Off

# Headers de seguridad (requieren mod_headers, habilitado en el Dockerfile).
# "always" para que salgan también en las respuestas de error.
#
# No se define una Content-Security-Policy acá a propósito: imponerla desde una
# imagen base rompe cualquier proyecto con scripts inline, y qué orígenes son
# válidos solo lo sabe cada proyecto. Va en el proyecto, no en la base.

# El navegador respeta el Content-Type declarado en vez de adivinarlo, que es
# como un upload de texto termina ejecutándose como script.
Header always set X-Content-Type-Options "nosniff"

# No filtrar la URL completa (que puede llevar ids o tokens) al navegar a otro
# sitio; a sitios sin TLS no se manda nada.
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Contra clickjacking: nadie puede meter la app en un iframe salvo ella misma.
Header always set X-Frame-Options "SAMEORIGIN"
