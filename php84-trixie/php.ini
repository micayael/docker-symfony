date.timezone = America/Asuncion
memory_limit=256M
short_open_tag=Off
expose_php=Off

; CVE-2026-109618 (PHP2Shell): el use-after-free está en el seguimiento del
; progreso de subida, que PHP procesa en todo multipart/form-data antes de llegar
; a la aplicación, aunque nunca llame a session_start(). Ningún proyecto lo usa,
; así que se apaga aunque PHP ya venga corregido (>= 8.4.27).
session.upload_progress.enabled=Off
